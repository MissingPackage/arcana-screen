version: 2
updates:
  - package-ecosystem: npm
    directory: /arcana-screen
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Deve restare PRIMA di development-tooling: una dipendenza entra nel
      # primo gruppo che matcha, e @types/react* sono devDependencies, quindi
      # altrimenti finirebbero nel gruppo sbagliato staccate da react/react-dom.
      # Un bump spezzato lascia react e react-dom su versioni diverse e fa
      # morire tutte le suite all'import (vedi D7: PR #80/#82, poi #93/#94).
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      development-tooling:
        dependency-type: development
    # Ognuna di queste ha fatto fallire da sola l'intero gruppo (PR #111).
    # Togliere la riga quando la causa accanto cade.
    ignore:
      # eslint-plugin-jsx-a11y 6.10.2 dichiara peer eslint fino a ^9: npm ci va in ERESOLVE.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x accetta typescript <6.1.0; la 7 non si installa.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # axe 4.14 accende label-content-name-mismatch (WCAG 2.5.3) su tre bottoni
      # del Combat: difetto vero dell'app, D48. Togliere quando D48 è chiuso.
      - dependency-name: "@axe-core/playwright"
        versions: [">=4.14.0"]
      # Con Playwright 1.65 la pagina Firefox crasha in CI dopo la prima
      # scansione axe (D49). Solo la 1.65: la 1.66 va riprovata da sola.
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
